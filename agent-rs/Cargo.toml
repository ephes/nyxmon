[workspace]
resolver = "3"
members = [
    "crates/nyxmon-core",
    "crates/nyxmon-store",
    "crates/nyxmon-checks",
    "crates/nyxmon-notify",
    "crates/nyxmon-agent",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/ephes/nyxmon"
publish = false

# Shared dependency versions. Slices add the crates they need here and refer to
# them with `workspace = true` from their crate manifests.
[workspace.dependencies]
nyxmon-core = { path = "crates/nyxmon-core" }
nyxmon-store = { path = "crates/nyxmon-store" }
nyxmon-checks = { path = "crates/nyxmon-checks" }
nyxmon-notify = { path = "crates/nyxmon-notify" }
indexmap = "2"
num-bigint = "0.4"
num-traits = "0.2"
tracing = "0.1"
idna = "1"
unicode-normalization = "0.1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-native-certs = "0.8"
tokio = "1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rcgen = "0.14"
rusqlite = { version = "0.40", features = ["bundled"] }
tempfile = "3"
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
url = "2"
webpki-roots = "1"
rand = "0.10"
regex = "1"
cookie_store = { version = "0.22", default-features = false, features = ["preserve_order"] }
flate2 = "1"
base64 = "0.22"
x509-parser = "0.18"
dns-lookup = "3"
hmac = "0.12"
md-5 = "0.10"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "unwind"
